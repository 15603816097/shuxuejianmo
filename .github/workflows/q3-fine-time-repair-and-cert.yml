name: q3-fine-time-repair-and-cert
# conservative exact-boundary rerun
on:
  push:
    branches:
      - chatgpt-architecture
    paths:
      - src/q3_fine_time_repair.py
      - .github/workflows/q3-fine-time-repair-and-cert.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  repair-cert:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy openpyxl ortools h5py
      - name: Download base candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/base
          gh run download 36243861245 -n q3-joint18x5-materialized -D /tmp/base
      - name: Re-optimize starts on 1 ms grid
        run: |
          python src/q3_fine_time_repair.py --base /tmp/base --out /tmp/repaired
      - name: Download hypergraph diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/joint /tmp/repaired/hypergraph
          gh run download 36241328424 -n q3-joint-grouping-search -D /tmp/joint
          cp /tmp/joint/q3_joint_grouping_hg/JOINT/block_diagnostics.csv /tmp/repaired/hypergraph/
      - name: Final continuous cert
        run: |
          python src/q3_final_continuous_cert.py --base /tmp/repaired --out results/q3_official
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3-fine-time-repair-and-cert
          path: results/q3_official/
