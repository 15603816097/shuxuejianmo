name: q3-strict-q2-route-audit

on:
  push:
    branches: [chatgpt-architecture]
    paths:
      - 'src/q3_strict_audit_q2_final.py'
      - '.github/workflows/q3-strict-q2-route-audit.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  strict-route-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install numpy pandas scipy openpyxl ortools h5py
      - name: Verify frozen obstacle-loss regression
        run: python src/test_q3_obstacle_loss_regression.py
      - name: Download frozen Q2 zero-lateness artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10882202914/zip"             -o /tmp/q2.zip
          mkdir -p /tmp/q2
          unzip -q /tmp/q2.zip -d /tmp/q2
          test -f /tmp/q2/phase2_min_makespan/schedule.csv
      - name: Strict route-level Q3 audit
        run: python src/q3_strict_audit_q2_final.py --schedule /tmp/q2/phase2_min_makespan/schedule.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3-strict-q2-route-audit-results
          path: results/q3_strict/
