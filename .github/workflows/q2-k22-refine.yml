name: q2-k22-refine

on:
  push:
    branches: [chatgpt-architecture]
    paths:
      - 'src/q2_k22_refine.py'
      - '.github/workflows/q2-k22-refine.yml'
  workflow_dispatch:

jobs:
  refine:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: [1, 7, 19, 43]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install numpy pandas scipy openpyxl ortools h5py
      - name: Download current K22 incumbent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10882608510/zip"             -o /tmp/k22.zip
          mkdir -p /tmp/k22
          unzip -q /tmp/k22.zip -d /tmp/k22
          test -f /tmp/k22/phase2_min_makespan/schedule.csv
      - name: Refine K22
        run: >
          python src/q2_k22_refine.py
          --seed ${{ matrix.seed }}
          --time-limit 1200
          --upper-bound 7307.7
          --hint-csv /tmp/k22/phase2_min_makespan/schedule.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-k22-refine-seed-${{ matrix.seed }}
          path: results/q2_v2/k22_refine/seed_${{ matrix.seed }}/
