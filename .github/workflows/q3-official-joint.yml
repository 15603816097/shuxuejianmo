name: q3-official-joint

on:
  push:
    branches: [chatgpt-architecture]
    paths:
      - 'src/q3_strict_edge_graph_all_types.py'
      - 'src/q3_strict_route_set_master.py'
      - '.github/workflows/q3-official-joint.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install numpy pandas scipy openpyxl ortools h5py
      - name: Frozen Q3 regression
        run: python src/test_q3_obstacle_loss_regression.py
      - name: Download frozen Q2 K22 optimum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/q2k22
          gh run download 36203061746 -n q2-k22-refine-seed-43 -D /tmp/q2k22
          test -f /tmp/q2k22/schedule.csv
      - name: Strict K22 route audit
        run: python src/q3_strict_audit_q2_final.py --schedule /tmp/q2k22/schedule.csv
      - name: Strict all-type communication graph
        run: python src/q3_strict_edge_graph_all_types.py
      - name: Exact 80-box strict route-set seed search
        run: python src/q3_strict_route_set_master.py
      - name: Copy baseline audit into official result bundle
        run: |
          mkdir -p results/q3_official/q2_k22_baseline
          cp -r results/q3_strict/* results/q3_official/q2_k22_baseline/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3-official-stage1
          path: results/q3_official/
