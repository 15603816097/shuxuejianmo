name: q3-official-joint

on:
  push:
    branches: [chatgpt-architecture]
    paths:
      - 'src/q3_strict_edge_graph_shard.py'
      - 'src/q3_merge_strict_edge_shards.py'
      - 'src/q3_strict_route_set_master.py'
      - '.github/workflows/q3-official-joint.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  q2-baseline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy openpyxl ortools h5py
      - run: python src/test_q3_obstacle_loss_regression.py
      - name: Download frozen Q2 K22 optimum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/q2k22
          gh run download 36203061746 -n q2-k22-refine-seed-43 -D /tmp/q2k22
          test -f /tmp/q2k22/schedule.csv
      - run: python src/q3_strict_audit_q2_final.py --schedule /tmp/q2k22/schedule.csv
      - uses: actions/upload-artifact@v4
        with:
          name: q3-k22-baseline-audit
          path: results/q3_strict/

  graph:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        type: [A, B, C]
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy openpyxl h5py
      - run: python src/q3_strict_edge_graph_shard.py --type ${{ matrix.type }} --shard ${{ matrix.shard }} --shards 4
      - uses: actions/upload-artifact@v4
        with:
          name: q3-edge-${{ matrix.type }}-${{ matrix.shard }}
          path: results/q3_official_shards/*.csv

  master:
    needs: [graph, q2-baseline-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy openpyxl ortools h5py
      - uses: actions/download-artifact@v4
        with:
          pattern: q3-edge-*
          path: results/q3_official_shards
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: q3-k22-baseline-audit
          path: results/q3_official/q2_k22_baseline
      - run: python src/q3_merge_strict_edge_shards.py
      - run: python src/q3_strict_route_set_master.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3-official-stage1
          path: results/q3_official/
