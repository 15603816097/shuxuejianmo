name: q2-v2-search

on:
  push:
    branches: [chatgpt-architecture]
    paths:
      - 'src/q2_v2_solver.py'
      - 'src/minimal_pipeline.py'
      - 'data/**'
      - '.github/workflows/q2-v2.yml'
  workflow_dispatch:

jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install numpy pandas scipy openpyxl ortools h5py
      - name: Run Q2-v2 7000 feasibility and makespan search
        run: python src/q2_v2_solver.py --target 7000 --time-limit 240 --triple-limit 900
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-v2-results
          path: results/q2_v2/
