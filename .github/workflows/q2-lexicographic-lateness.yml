name: q2-lexicographic-lateness

on:
  push:
    branches: [chatgpt-architecture]
    paths:
      - 'src/q2_lexicographic_lateness.py'
      - '.github/workflows/q2-lexicographic-lateness.yml'
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install numpy pandas scipy openpyxl ortools h5py
      - name: Phase 1 minimize total soft lateness; Phase 2 minimize makespan
        run: python src/q2_lexicographic_lateness.py --phase1-time 600 --phase2-time 360 --triple-limit 900
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-lexicographic-lateness-results
          path: results/q2_v2/lexicographic/
