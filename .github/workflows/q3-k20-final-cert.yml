name: q3-k20-final-cert
on:
  push:
    branches:
      - chatgpt-architecture
    paths:
      - .github/workflows/q3-k20-final-cert.yml
      - src/q3_fine_time_repair.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy openpyxl ortools h5py
      - name: Download K20 Pareto candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/k20
          gh run download 36249616987 -n q3-k20-pareto -D /tmp/k20
          find /tmp/k20 -maxdepth 4 -type f | sort
      - name: Materialize fixed K20 + 5 relay missions
        run: |
          python src/q3_joint18x5_materialize.py \
            --schedule /tmp/k20/master/selected_schedule.csv \
            --hypergraph /tmp/k20/hg/K20 \
            --out /tmp/k20_materialized
      - name: Fine-time exact resource repair
        run: |
          python src/q3_fine_time_repair.py \
            --base /tmp/k20_materialized \
            --out /tmp/k20_repaired
      - name: Stage strict hypergraph diagnostics
        run: |
          mkdir -p /tmp/k20_repaired/hypergraph
          cp /tmp/k20/hg/K20/block_diagnostics.csv /tmp/k20_repaired/hypergraph/
      - name: Final recursive continuous-time certification
        run: |
          python src/q3_final_continuous_cert.py \
            --base /tmp/k20_repaired \
            --out results/q3_k20_final
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3-k20-final-cert
          path: |
            results/q3_k20_final/
            /tmp/k20_repaired/
