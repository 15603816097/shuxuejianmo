name: q3-multistop-under7000-search
on:
  push:
    branches:
      - chatgpt-architecture
    paths:
      - .github/workflows/q3-multistop-under7000-search.yml
      - src/q3_target_relay_search.py
      - src/q3_fine_time_repair.py
      - src/q3_final_continuous_cert.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy openpyxl ortools h5py

      - name: Generate 1-3 stop transport pool and search <=7000s
        run: |
          python src/q2_v2_solver.py \
            --triple-limit 900 \
            --time-limit 420 \
            --target 7000

      - name: Select constructive multi-stop schedule
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd, json, shutil
          root=Path("results/q2_v2")
          cand=[root/"target7000_schedule.csv",root/"min_makespan_schedule.csv"]
          src=next((p for p in cand if p.exists()),None)
          if src is None:
              raise SystemExit("no constructive transport schedule")
          df=pd.read_csv(src)
          if "transport_energy_kwh" not in df.columns and "energy_kwh" in df.columns:
              df["transport_energy_kwh"]=df["energy_kwh"]
          out=Path("results/q3_multistop")
          out.mkdir(parents=True,exist_ok=True)
          df.to_csv(out/"transport_seed.csv",index=False,encoding="utf-8-sig")
          n_multi=int((df["visit_order"].astype(str).str.contains(">")).sum())
          rec={
            "source":str(src),
            "transport_routes":len(df),
            "multi_stop_routes":n_multi,
            "transport_makespan_s":float(df["return_s"].max()),
            "transport_energy_kwh":float(df["transport_energy_kwh"].sum())
          }
          (out/"transport_seed_summary.json").write_text(json.dumps(rec,ensure_ascii=False,indent=2),encoding="utf-8")
          print("MULTISTOP_SEED="+json.dumps(rec,ensure_ascii=False))
          PY

      - name: Strict continuous-communication hover hypergraph
        run: |
          python src/q3_hover_hypergraph.py \
            --schedule results/q3_multistop/transport_seed.csv \
            --label MULTI \
            --out results/q3_multistop/hg

      - name: Search 3 and 4 relay missions under 7000s and fully certify
        shell: bash
        run: |
          set -u
          for M in 3 4; do
            BASE="results/q3_multistop/m${M}"
            mkdir -p "$BASE"
            echo "=== MULTI-STOP M=$M ==="
            set +e
            python src/q3_target_relay_search.py \
              --schedule results/q3_multistop/transport_seed.csv \
              --hypergraph results/q3_multistop/hg/MULTI \
              --relay-sorties "$M" \
              --target-s 7000 \
              --time-limit 420 \
              --out "$BASE/materialized"
            RC=$?
            set -e
            if [ "$RC" -ne 0 ]; then
              echo "MULTI M=$M target search infeasible/not found"
              continue
            fi

            python src/q3_fine_time_repair.py \
              --base "$BASE/materialized" \
              --out "$BASE/repaired" \
              --joint-cap-s 7000 \
              --prioritize-soft

            mkdir -p "$BASE/repaired/hypergraph"
            cp results/q3_multistop/hg/MULTI/block_diagnostics.csv "$BASE/repaired/hypergraph/"

            python src/q3_final_continuous_cert.py \
              --base "$BASE/repaired" \
              --out "$BASE/final"

            python - "$BASE/final/q3_global_summary.json" "$M" <<'PY'
          import json,sys
          p,m=sys.argv[1],int(sys.argv[2])
          s=json.load(open(p,encoding="utf-8"))
          out={
            "relay_sorties":m,
            "certified":s.get("q3_global_certified"),
            "transport_routes":s.get("transport_routes"),
            "joint_completion_s":s.get("joint_completion_s"),
            "under_7000":bool(s.get("q3_global_certified") and s.get("joint_completion_s",1e99)<7000),
            "soft_violation_boxes":s.get("soft_violation_boxes"),
            "total_soft_lateness_s":s.get("total_soft_lateness_s"),
            "transport_energy_kwh":s.get("transport_energy_kwh"),
            "relay_energy_kwh":s.get("relay_energy_kwh"),
            "joint_energy_kwh":s.get("joint_energy_kwh"),
            "continuous_communication_pass":s.get("continuous_communication_pass")
          }
          print("MULTISTOP_FINAL="+json.dumps(out,ensure_ascii=False))
          PY
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3-multistop-under7000-search
          path: |
            results/q2_v2/
            results/q3_multistop/
