name: q3-joint-wave-screen
on:
  push:
    branches:
      - chatgpt-architecture
    paths:
      - .github/workflows/q3-joint-wave-screen.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy openpyxl ortools h5py
      - name: Download joint-search artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/joint
          gh run download 36241328424 -n q3-joint-grouping-search -D /tmp/joint
      - name: Find minimum relay sortie count for JOINT schedule
        run: |
          python src/q3_friend_wave_screen.py             --schedule /tmp/joint/q3_joint_grouping/selected_schedule.csv             --hypergraph /tmp/joint/q3_joint_grouping_hg/JOINT             --label JOINT             --out results/q3_joint_wave_screen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3-joint-wave-screen
          path: results/q3_joint_wave_screen/
