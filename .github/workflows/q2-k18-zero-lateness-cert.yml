name: q2-k18-zero-lateness-cert

on:
  push:
    branches: [chatgpt-architecture]
    paths:
      - '.github/workflows/q2-k18-zero-lateness-cert.yml'
  workflow_dispatch:

jobs:
  certify-k18:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install numpy pandas scipy openpyxl ortools h5py
      - name: Test K18 with zero soft lateness
        run: python src/q2_zero_lateness.py --k 18 --time-limit 1200 --triple-limit 900
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-k18-zero-lateness-cert-results
          path: results/q2_v2/zero_late/K18/
