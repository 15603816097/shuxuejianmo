name: q3-gate-diagnostic
on:
  push:
    branches: [chatgpt-architecture]
    paths:
      - 'src/q3_gate_diagnostic.py'
      - '.github/workflows/q3-gate-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: K22
            q2_run: 36203061746
            q2_artifact: q2-k22-refine-seed-43
            hg_artifact: q3-hover-hypergraph-K22
          - label: K23
            q2_run: 36206159819
            q2_artifact: q2-gap-r2-K23-seed-29
            hg_artifact: q3-hover-hypergraph-K23
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy openpyxl ortools h5py
      - name: Download inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/q2 /tmp/hg
          gh run download ${{ matrix.q2_run }} -n ${{ matrix.q2_artifact }} -D /tmp/q2
          gh run download 36228095518 -n ${{ matrix.hg_artifact }} -D /tmp/hg
      - name: Run nested feasibility gates
        run: python src/q3_gate_diagnostic.py --schedule /tmp/q2/schedule.csv --hypergraph /tmp/hg --label ${{ matrix.label }} --out results/q3_gate_diag
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3-gate-diagnostic-${{ matrix.label }}
          path: results/q3_gate_diag/
