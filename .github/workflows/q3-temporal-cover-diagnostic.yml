name: q3-temporal-cover-diagnostic

on:
  push:
    branches: [chatgpt-architecture]
    paths:
      - 'src/q3_temporal_cover_diagnostic.py'
      - '.github/workflows/q3-temporal-cover-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy openpyxl h5py
      - name: Download K22 and strict hypergraph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/q2 /tmp/hg
          gh run download 36203061746 -n q2-k22-refine-seed-43 -D /tmp/q2
          gh run download 36228095518 -n q3-hover-hypergraph-K22 -D /tmp/hg
      - run: python src/q3_temporal_cover_diagnostic.py --schedule /tmp/q2/schedule.csv --hypergraph /tmp/hg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3-temporal-cover-k22
          path: results/q3_temporal_cover/
