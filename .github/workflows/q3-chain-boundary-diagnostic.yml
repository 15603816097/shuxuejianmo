name: q3-chain-boundary-diagnostic
on:
  push:
    branches:
      - chatgpt-architecture
    paths:
      - .github/workflows/q3-chain-boundary-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - name: Download latest cert
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/cert
          gh run download 36245693057 -n q3-fine-time-repair-and-cert -D /tmp/cert
      - name: Inspect chain boundary deltas
        run: |
          python - <<'PY'
          import pandas as pd
          c=pd.read_csv('/tmp/cert/continuous_communication_certificate.csv')
          b=pd.read_csv('/tmp/cert/block_assignments.csv')
          m=pd.read_csv('/tmp/cert/relay_missions.csv')
          f=c[c['pass']==False].copy()
          for _,r in f.iterrows():
              bid=str(r.block_id)
              ar=b[b.block_id.astype(str)==bid].iloc[0]
              mr=m[m.mission_id.astype(str)==str(ar.mission_id)].iloc[0]
              print({
                'block_id':bid,'route':int(r.route_index),'mission':str(ar.mission_id),
                'cert_start':float(r.start_s),'cert_end':float(r.end_s),
                'assign_start':float(ar.block_start_s),'assign_end':float(ar.block_end_s),
                'service_start':float(mr.service_start_s),'service_end':float(mr.service_end_s),
                'left_gap_s':float(r.start_s)-float(mr.service_start_s),
                'right_gap_s':float(mr.service_end_s)-float(r.end_s),
              })
          PY
