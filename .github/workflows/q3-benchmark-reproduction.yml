name: q3-benchmark-reproduction

on:
  push:
    branches: [chatgpt-architecture]
    paths:
      - '.github/workflows/q3-benchmark-reproduction.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy openpyxl ortools h5py
      - name: Run validated Q3 bounded feasibility scan K19-K27
        shell: bash
        run: |
          set -e
          mkdir -p results/q3_benchmark_scan
          for K in 19 20 21 22 23 24 25 26 27; do
            echo "=== K=$K ==="
            python src/q3_final_feasibility_scan.py --k "$K" | tee "results/q3_benchmark_scan/K$K.log" || true
            cp "results/q3_K$K_final_scan_summary.csv" "results/q3_benchmark_scan/K$K_summary.csv" 2>/dev/null || true
          done
      - name: Aggregate scan
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd, json
          root=Path("results/q3_benchmark_scan")
          rows=[]
          for p in sorted(root.glob("K*_summary.csv")):
              try:
                  d=pd.read_csv(p)
                  if len(d): rows.append(d.iloc[0].to_dict())
              except Exception:
                  pass
          out=pd.DataFrame(rows)
          out.to_csv(root/"aggregate.csv",index=False)
          if len(out) and "complete_feasible" in out:
              best=out[out["complete_feasible"]==True]
          else:
              best=out.iloc[0:0]
          summary={
            "tested_K": [int(x) for x in out.K.tolist()] if len(out) and "K" in out else [],
            "complete_feasible_K": [int(x) for x in best.K.tolist()] if len(best) and "K" in best else [],
            "note":"Bounded scan only; no global-optimality claim."
          }
          (root/"summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q3-benchmark-reproduction
          path: results/q3_benchmark_scan/
