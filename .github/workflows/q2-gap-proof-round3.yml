name: q2-gap-proof-round3

on:
  push:
    branches: [chatgpt-architecture]
    paths:
      - '.github/workflows/q2-gap-proof-round3.yml'
  workflow_dispatch:

jobs:
  prove:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        k: [18, 19, 24, 25, 26]
        seed: [101, 307]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install numpy pandas scipy openpyxl ortools h5py
      - name: Resolve best incumbent
        id: src
        shell: bash
        run: |
          K=${{ matrix.k }}
          case "$K" in
            18) echo "hintseed=71" >> "$GITHUB_OUTPUT"; echo "ub=8855.3" >> "$GITHUB_OUTPUT" ;;
            19) echo "hintseed=29" >> "$GITHUB_OUTPUT"; echo "ub=8117.2" >> "$GITHUB_OUTPUT" ;;
            24) echo "hintseed=71" >> "$GITHUB_OUTPUT"; echo "ub=6310.2" >> "$GITHUB_OUTPUT" ;;
            25) echo "hintseed=29" >> "$GITHUB_OUTPUT"; echo "ub=5977.8" >> "$GITHUB_OUTPUT" ;;
            26) echo "hintseed=29" >> "$GITHUB_OUTPUT"; echo "ub=6056.3" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Download round-2 incumbent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p /tmp/hint
          gh run download 36206159819             -n "q2-gap-r2-K${{ matrix.k }}-seed-${{ steps.src.outputs.hintseed }}"             -D /tmp/hint
          HINT="$(find /tmp/hint -name schedule.csv | head -1)"
          test -n "$HINT"
          echo "HINT=$HINT" >> "$GITHUB_ENV"
      - name: Deep fixed-K proof search
        run: >
          python src/q2_fixed_k_gap_refine.py
          --k ${{ matrix.k }}
          --seed ${{ matrix.seed }}
          --time-limit 3600
          --upper-bound ${{ steps.src.outputs.ub }}
          --hint-csv "$HINT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-gap-r3-K${{ matrix.k }}-seed-${{ matrix.seed }}
          path: results/q2_v2/gap_refine/K${{ matrix.k }}/seed_${{ matrix.seed }}/
